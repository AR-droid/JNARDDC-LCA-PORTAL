<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JNARDDC LCA Portal</title>
    <meta name="description" content="AI-powered Life Cycle Assessment for Indian metal sector" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS for maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body>
    <!-- Google Translate element - visually hidden but functional -->
    <div id="google_translate_element" style="position: fixed; top: 0; right: 0; opacity: 0; pointer-events: none; z-index: -1;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Google Translate - Delayed initialization to prevent routing issues -->
    <script type="text/javascript">
      // Clear any existing googtrans cookies on page load to prevent auto-translation
      (function() {
        document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=' + window.location.hostname;
        document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.' + window.location.hostname;
      })();
      
      // Flag to track if Google Translate has been initialized
      window.googleTranslateLoaded = false;
      
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi', 
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
        window.googleTranslateLoaded = true;
      }
      
      // Load Google Translate script only after React app has mounted (delay 2 seconds)
      function loadGoogleTranslate() {
        if (document.getElementById('google-translate-script')) return;
        var script = document.createElement('script');
        script.id = 'google-translate-script';
        script.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
        script.async = true;
        document.body.appendChild(script);
      }
      
      // Wait for DOM to be fully loaded, then delay Google Translate loading
      if (document.readyState === 'complete') {
        setTimeout(loadGoogleTranslate, 2000);
      } else {
        window.addEventListener('load', function() {
          setTimeout(loadGoogleTranslate, 2000);
        });
      }
    </script>
  </body>
</html>
