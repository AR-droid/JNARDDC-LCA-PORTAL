services:
  # Backend Service
  - type: web
    name: jnarddc-lca-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FLASK_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /data/users.db

    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1

  # Frontend Service
  - type: web
    name: jnarddc-lca-frontend
    env: static
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: jnarddc-lca-backend
          property: url
          envVarKey: VITE_API_URL
